name: DataMark ML Pipeline CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-train:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v3

    - name: Configurar Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy scikit-learn xgboost catboost joblib mlflow

    - name: Ejecutar Pipeline de Entrenamiento
      run: |
        # Aquí ejecutamos tu script principal. 
        # Asegurate de que el nombre coincida con tu archivo .py
        python model_training.py

    - name: Verificar generación de Artefactos
      run: |
        # Comprobamos que existan los archivos críticos para la entrega
        test -f ./models/prediction/coffee_model_SVR.pkl
        test -f ./metrics/model_comparison_ranking.csv
        echo "✅ Pipeline ejecutado con éxito y archivos generados."

    - name: Upload de métricas como artefactos de GitHub
      uses: actions/upload-artifact@v3
      with:
        name: model-metrics
        path: ./metrics/model_comparison_ranking.csv