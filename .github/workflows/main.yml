name: DataMark ML Pipeline CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-train:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v3

    - name: Configurar Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        # Añadimos seaborn y matplotlib para que los scripts de visualización no fallen
        pip install pandas numpy scikit-learn xgboost catboost joblib mlflow matplotlib seaborn

    - name: Ejecutar Pipeline de Entrenamiento
      run: |
        # Ejecutamos tu script principal. 
        # Asegúrate de que este script incluya la lógica de guardado que armamos
        python model_training.py

    - name: Verificar generación de Artefactos
      run: |
        # 1. Verificamos modelos de predicción
        test -f ./models/prediction/coffee_model_SVR.pkl
        
        # 2. Verificamos métricas
        test -f ./metrics/model_comparison_ranking.csv
        
        # 3. Verificamos los nuevos archivos del Recomendador (Clusterización y PCA)
        test -f ./models/recommender/coffee_catalog_clustered.csv
        test -f ./models/recommender/proyeccion_2d_pca.csv
        test -f ./models/recommender/perfil_sabor_clusters.csv
        
        echo "✅ Todos los archivos críticos fueron generados correctamente."

    - name: Upload de Resultados (Métricas y Modelos)
      uses: actions/upload-artifact@v3
      with:
        name: pipeline-results
        path: |
          ./metrics/
          ./models/recommender/
          ./models/prediction/